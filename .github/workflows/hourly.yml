name: hourly-news-video

on:
  schedule:
    - cron: "23 * * * *"  # not minute 0: GitHub drops/delays the top-of-hour slot under load
  workflow_dispatch:

concurrency:
  group: hourly-news-video
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # lets the run trigger its own next run

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps (ffmpeg, espeak-ng) and font
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
          mkdir -p assets
          curl -fsSL -o assets/Anton-Regular.ttf \
            https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf

      - name: Python deps (CPU-only torch keeps the install small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en

      - name: Generate one video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          GH_UPLOAD_TOKEN: ${{ secrets.GH_UPLOAD_TOKEN }}
          TIKTOK_ACCOUNT_ID: ${{ secrets.TIKTOK_ACCOUNT_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: python main.py

      - name: Upload video (output/YYYYMMDD/ folder kept)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Chain the next run at minute 05 of the next hour
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --workflow hourly.yml --repo "$GITHUB_REPOSITORY" --json databaseId,status             --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != \"completed\")] | length")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$active" != "0" ]; then
            echo "another run is active; leaving the chain to it"; exit 0
          fi
          queued=$(gh run list --workflow hourly.yml --repo "$GITHUB_REPOSITORY" --status queued --json databaseId --jq length)
          [ "$queued" != "0" ] && { echo "next run already queued"; exit 0; }
          now=$(date +%s); next=$(date -d "$(date -u +%Y-%m-%dT%H:05:00Z) + 1 hour" +%s)
          [ $((next - now)) -gt 3600 ] && next=$((next - 3600))
          sleep $((next - now))
          gh workflow run hourly.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
